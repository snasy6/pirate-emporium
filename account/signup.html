<!DOCTYPE html>
<html>

<head>

    <title>Create Account - Bances Pirate Emporium</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="board">

        <h1>🏴‍☠️ Bances Pirate Emporium 🏴‍☠️</h1>

        <h2>🏴 Create Pirate Account</h2>


        <div class="account-form">

            <label for="username">
                Pirate Name
            </label>

            <br>

            <input
                type="text"
                id="username"
                placeholder="Choose your pirate name"
                autocomplete="username"
            >

            <br><br>


            <label for="email">
                Email
            </label>

            <br>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
            >

            <br><br>


            <label for="password">
                Password
            </label>

            <br>

            <input
                type="password"
                id="password"
                placeholder="Choose a password"
                autocomplete="new-password"
            >

            <br><br>


            <button id="signupButton">
                🏴‍☠️ Create Account
            </button>

        </div>


        <br>


        <p>
            Already have an account?
            <a href="login.html">
                🔑 Login
            </a>
        </p>


        <p>
            <a href="index.html">
                🏠 Back to Emporium
            </a>
        </p>


        <p id="signupMessage"></p>

    </div>


    <script
        type="module"
        src="auth.js">
    </script>

</body>

</html>
