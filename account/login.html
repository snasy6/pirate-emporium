<!DOCTYPE html>
<html>

<head>
    <title>Login - Bances Pirate Emporium</title>

</head>

<body>

    <h1>🏴‍☠️ Bances Pirate Emporium 🏴‍☠️</h1>

    <h2>🔑 Login</h2>

        type="email"

        id="password"

    <br><br>

    <p>
        Don't have an account?
        <a href="signup.html">Create one</a>
    </p>

    <p>
        <a href="index.html">🏠 Back Home</a>
    </p>

</div>

<script type="module" src="auth.js"></script>

</body>

</html>
