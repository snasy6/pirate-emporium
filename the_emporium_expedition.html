<!DOCTYPE html>
<html>

<head>

<title>🏴‍☠️ The Emporium Expedition</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

.container{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:15px;
    padding:20px;
}

.box{
    background:#222;
    border:2px solid #8b6b2f;
    border-radius:10px;
    padding:15px;
}

button{
    background:#8b6b2f;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#c49a45;
}

.crewMember{
    border:1px solid #555;
    margin:10px;
    padding:10px;
    border-radius:8px;
}

h1{
    color:#d4af37;
}

</style>

</head>


<body>


<h1>🏴‍☠️ The Emporium Expedition</h1>


<div class="container">


<div class="box">

<h2>Stats</h2>

<div id="stats">

Loading...

</div>

</div>



<div class="box">

<h2>Ship</h2>

<div id="ship">

Loading...

</div>


<br>

<button id="renameShip">

Rename Ship

</button>


<br><br>


<button id="upgradeShip">

Upgrade Ship

</button>


</div>




<div class="box">

<h2>Mission</h2>

<div id="mission">

No expedition active

</div>


<br>

<button id="sendCrew">

Send Crew

</button>


</div>




<div class="box">

<h2>🏴‍☠️ Crew</h2>

<div id="crew">

Loading...

</div>

</div>




<div class="box">

<h2>🎒 Inventory</h2>

<div id="inventory">

Loading...

</div>

</div>




<div class="box">

<h2>🏝️ Island Market</h2>

<div id="market">

Loading...

</div>

</div>




<div class="box">

<h2>🏝️ Rest</h2>

<button id="mainIsland">

Rest Crew

</button>

</div>




<div class="box">

<h2>💰 Loot Log</h2>

<div id="loot">

No treasure yet

</div>

</div>



</div>


<script src="the_emporium_expedition.js"></script>


</body>

</html>
