<body>


<h1>

<h3>
⚠️ Development Build
</h3>



<div class="panel">

<h2>

</h2>

<div id="stats">
Loading...

</div>




<div class="panel">

</h2>

<div id="ship">
Loading...
</div>


<br>


<button id="renameShip">

</button>


</div>






<div class="panel">

<h2>
👥 Crew
</h2>


<div id="crew">

</div>


</div>

</h2>


<div id="inventory">

</div>


</div>

<button id="mainIsland">

</button>


</div>

<h2>
⚓ Active Expedition
</h2>

</div>



<br>


<button id="sendCrew">

🚢 Send Crew On Expedition

</button>


</div>







<div class="panel">


<h2>
💰 Treasure Hold
</h2>


<div id="loot">

</div>


</div>

<button>

</div>
