<!DOCTYPE html>
<html>

<head>

<title>🏴‍☠️ The Emporium Expedition</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
}


.container{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:15px;
    padding:20px;
}


.box{
    background:#222;
    border:2px solid #8b6b2f;
    border-radius:10px;
    padding:15px;
}


button{
    background:#8b6b2f;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}


button:hover{
    background:#c49a45;
}


.crewMember{
    border:1px solid #555;
    margin:10px;
    padding:10px;
    border-radius:8px;
}


h1{
    color:#d4af37;
}


/* COLLAPSIBLE STYLE */

details{
    background:#1a1a1a;
    border-radius:8px;
    padding:8px;
}


summary{
    cursor:pointer;
    font-size:20px;
    color:#d4af37;
    font-weight:bold;
}


summary:hover{
    color:#ffd700;
}


</style>

</head>


<body>


<h1>🏴‍☠️ The Emporium Expedition</h1>


<div class="container">



<div class="box">

<details open>

<summary>📊 Stats</summary>

<br>

<div id="stats">

Loading...

</div>

</details>

</div>





<div class="box">

<details open>

<summary>🚢 Ship</summary>

<br>

<div id="ship">

Loading...

</div>


<br>


<button id="renameShip">

Rename Ship

</button>


<br><br>


<button id="upgradeShip">

Upgrade Ship

</button>


</details>

</div>







<div class="box">

<details open>

<summary>🗺️ Mission</summary>

<br>

<div id="mission">

No expedition active

</div>


<br>


<button id="sendCrew">

Send Crew

</button>


</details>

</div>







<div class="box">

<details>

<summary>🏴‍☠️ Crew</summary>

<br>

<div id="crew">

Loading...

</div>


</details>

</div>







<div class="box">

<details>

<summary>🎒 Inventory</summary>

<br>

<div id="inventory">

Loading...

</div>


</details>

</div>







<div class="box">

<details>

<summary>🏝️ Island Market</summary>

<br>

<div id="market">

Loading...

</div>


</details>

</div>







<div class="box">

<details>

<summary>🏝️ Rest</summary>

<br>


<button id="mainIsland">

Rest Crew

</button>


</details>

</div>







<div class="box">

<details>

<summary>💰 Loot Log</summary>

<br>

<div id="loot">

No treasure yet

</div>


</details>

</div>





</div>



<script src="the_emporium_expedition.js"></script>


</body>

</html>
